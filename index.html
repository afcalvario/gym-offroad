<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Offroad — Mi Rutina</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
  --accent:#f0883e;--accent2:#79c0ff;--text:#e6edf3;--muted:#8b949e;
  --green:#3fb950;--pink:#f778ba;--red:#f85149;
}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
.topbar-title{font-size:18px;font-weight:700}
.topbar-title span{color:var(--accent)}
.streak-badge{background:#21262d;border:1px solid var(--border);color:var(--accent2);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
/* TABS */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:60}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;cursor:pointer;-webkit-user-select:none;user-select:none}
.nav-ico{font-size:20px;opacity:.45;font-style:normal}
.nav-lbl{font-size:10px;color:var(--muted)}
.nav-item.active .nav-ico{opacity:1}
.nav-item.active .nav-lbl{color:var(--accent);font-weight:700}
/* WEEK STRIP */
.week-strip{display:flex;gap:6px;padding:14px 16px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.week-strip::-webkit-scrollbar{display:none}
.day-btn{flex:0 0 auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 13px;cursor:pointer;text-align:center;min-width:60px;-webkit-user-select:none;user-select:none}
.day-btn.active{background:var(--accent);border-color:var(--accent)}
.day-btn .de{font-size:15px}
.day-btn .dl{font-size:12px;font-weight:700;margin-top:2px}
.day-btn.active .dl{color:#1a0800}
.day-btn .done-dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin:4px auto 0}
/* DAY HEADER */
.day-header{margin:4px 16px 12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.dh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dh-title{font-size:18px;font-weight:700}
.dh-focus{font-size:11px;color:var(--accent);font-weight:600;background:rgba(240,136,62,.12);padding:4px 10px;border-radius:8px}
.dh-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.moto-card{background:rgba(240,136,62,.06);border:1px solid rgba(240,136,62,.2);border-radius:14px;padding:13px 16px;margin:0 16px 12px}
.moto-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:5px}
.moto-text{font-size:12px;color:var(--muted);line-height:1.55}
.phase-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;padding:2px 16px 8px;text-transform:uppercase}
.phase-label.pk{color:var(--pink)}
/* EXERCISE CARDS */
.exercise-list{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ex-card.open{border-color:var(--accent)}
.ex-card.glute{border-left:3px solid var(--pink)}
.ex-card.glute.open{border-color:var(--pink)}
.ex-head{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.ex-num{width:30px;height:30px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0}
.ex-num.g{color:var(--pink)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;line-height:1.3}
.ex-sets{font-size:12px;color:var(--muted);margin-top:3px}
.ex-muscle{font-size:10px;font-weight:600;color:var(--accent2);background:rgba(121,192,255,.1);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px}
.ex-muscle.g{color:var(--pink);background:rgba(247,120,186,.1)}
.ex-arrow{color:var(--muted);font-size:17px;transition:transform .25s;flex-shrink:0;font-style:normal}
.ex-card.open .ex-arrow{transform:rotate(180deg)}
.ex-body{display:none;border-top:1px solid var(--border);padding:14px}
.ex-card.open .ex-body{display:block}
.ex-img{width:100%;height:165px;object-fit:cover;border-radius:10px;background:var(--surface2);display:block;margin-bottom:12px}
.ex-desc{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:12px}
.ex-tip{border-radius:8px;padding:11px 13px;font-size:12px;line-height:1.55;margin-bottom:12px}
.ex-tip.gr{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);color:var(--green)}
.ex-tip.pk{background:rgba(247,120,186,.08);border:1px solid rgba(247,120,186,.2);color:var(--pink)}
.yt-btn{display:flex;align-items:center;justify-content:center;gap:9px;background:#1a0d00;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:11px;font-size:13px;font-weight:600;text-decoration:none;width:100%;margin-bottom:14px}
.yt-ic{color:#ff4444;font-size:16px}
/* WEIGHT LOG */
.log-section{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px}
.log-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.last-session{font-size:11px;color:var(--accent2);margin-bottom:10px;line-height:1.5}
.last-session b{color:var(--text)}
.set-check{font-size:10px;font-weight:800}
.set-check.hit{color:var(--green)}
.set-check.miss{color:var(--muted)}
.progress-alert{background:rgba(63,185,80,.1);border:1px solid var(--green);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--green);line-height:1.55;margin-bottom:10px;font-weight:600}
.progress-alert b{color:var(--green)}
.progress-alert.pending{background:rgba(240,136,62,.1);border-color:var(--accent);color:var(--accent)}
.progress-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(63,185,80,.15);color:var(--green);font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.progress-badge.pending{background:rgba(240,136,62,.15);color:var(--accent)}
.summary-ready{margin:0 16px 14px;background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.3);border-radius:14px;padding:14px 16px}
.summary-ready-title{font-size:13px;font-weight:700;color:var(--green);margin-bottom:8px}
.summary-ready-item{font-size:12px;color:var(--text);padding:5px 0;border-top:1px solid rgba(63,185,80,.15)}
.summary-ready-item:first-child{border-top:none}
.summary-ready-item b{color:var(--green)}
.summary-none{margin:0 16px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;font-size:12px;color:var(--muted);line-height:1.6}
.serie-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.serie-lbl{font-size:11px;font-weight:700;color:var(--muted);width:48px;flex-shrink:0}
.serie-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:8px 10px;text-align:center;-moz-appearance:textfield}
.serie-row input::-webkit-outer-spin-button,.serie-row input::-webkit-inner-spin-button{-webkit-appearance:none}
.serie-row input:focus{outline:none;border-color:var(--accent)}
.unit-lbl{font-size:11px;color:var(--muted);width:24px;flex-shrink:0}
.save-btn{width:100%;background:var(--accent);border:none;color:#1a0800;font-size:13px;font-weight:700;border-radius:10px;padding:11px;cursor:pointer;margin-top:6px}
.save-btn.saved{background:var(--green);color:#04140a}
/* CARDIO CARD */
.cardio-card{margin:0 16px;background:rgba(121,192,255,.06);border:1px solid rgba(121,192,255,.25);border-radius:14px;padding:14px 16px}
.cardio-title{font-size:13px;font-weight:700;color:var(--accent2);margin-bottom:5px}
.cardio-text{font-size:12px;color:var(--muted);line-height:1.6}
/* FINISH DAY */
.finish-btn{display:block;margin:16px;width:calc(100% - 32px);background:var(--green);border:none;color:#04140a;font-size:14px;font-weight:700;border-radius:12px;padding:14px;cursor:pointer}
.finish-btn.done{background:var(--surface);border:1px solid var(--green);color:var(--green)}
/* ATTENDANCE */
.att-month{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.att-month-name{font-size:16px;font-weight:700;text-transform:capitalize}
.att-nav{background:var(--surface);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px 16px 16px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:9px;color:var(--muted);background:var(--surface);border:1px solid transparent}
.cal-cell.empty{background:transparent}
.cal-cell.gym{background:rgba(63,185,80,.18);border-color:var(--green);color:var(--green);font-weight:700}
.cal-cell.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal-cell.gym.today{color:var(--green)}
.stats-row{display:flex;gap:10px;padding:0 16px 16px}
.stat-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-num{font-size:24px;font-weight:800;color:var(--accent)}
.stat-num.gr{color:var(--green)}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
/* PROGRESS */
.prog-ex-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin:0 16px 8px}
.prog-ex-name{font-size:13px;font-weight:700;margin-bottom:8px}
.prog-history{font-size:11px;color:var(--muted);line-height:1.8}
.prog-history b{color:var(--accent2)}
.prog-delta{font-size:11px;font-weight:700;margin-left:6px}
.prog-delta.up{color:var(--green)}
.prog-delta.same{color:var(--muted)}
.empty-state{text-align:center;padding:50px 30px;color:var(--muted);font-size:13px;line-height:1.7}
.empty-ico{font-size:42px;margin-bottom:12px;font-style:normal;display:block}
.section-intro{font-size:12px;color:var(--muted);line-height:1.6;padding:6px 20px 14px}
.spacer{height:12px}
.guide-card{margin:0 16px 10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.guide-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
.guide-text{font-size:12px;color:var(--muted);line-height:1.65}
/* BACKUP */
.backup-card{margin:0 16px 12px;background:rgba(121,192,255,.06);border:1px solid rgba(121,192,255,.3);border-radius:14px;padding:16px}
.backup-title{font-size:14px;font-weight:700;color:var(--accent2);margin-bottom:6px}
.backup-text{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.backup-btns{display:flex;gap:8px}
.bk-btn{flex:1;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer}
.bk-btn.exp{background:var(--accent2);color:#06121f}
.bk-btn.imp{background:var(--surface);border:1px solid var(--accent2);color:var(--accent2)}
.backup-status{font-size:11px;margin-top:10px;line-height:1.5;display:none}
.backup-status.ok{display:block;color:var(--green)}
.backup-status.err{display:block;color:var(--red)}
.backup-meta{font-size:11px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-title">Gym <span>Offroad</span></div>
    <div class="streak-badge" id="streak-badge">💪 0 días este mes</div>
  </div>
  <div id="view"></div>
  <div class="bottom-nav">
    <div class="nav-item active" data-tab="rutina" onclick="setTab('rutina')"><i class="nav-ico">🏋️</i><span class="nav-lbl">Rutina</span></div>
    <div class="nav-item" data-tab="asistencia" onclick="setTab('asistencia')"><i class="nav-ico">📅</i><span class="nav-lbl">Asistencia</span></div>
    <div class="nav-item" data-tab="progreso" onclick="setTab('progreso')"><i class="nav-ico">📈</i><span class="nav-lbl">Progreso</span></div>
    <div class="nav-item" data-tab="guia" onclick="setTab('guia')"><i class="nav-ico">📖</i><span class="nav-lbl">Guía</span></div>
  </div>
</div>

<script>
/* ============ DATOS DE LA RUTINA ============
   Split diseñado para novato de 42 años, 5 días, 90 min.
   Volumen semanal: 8-12 series por grupo muscular.
   Glúteos: ~12 series/semana (énfasis). 48h+ entre grupos.
*/
const IMGS = {
  cardio:"https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=600&q=75",
  maquina:"https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&q=75",
  mancuerna:"https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=600&q=75",
  polea:"https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=600&q=75",
  pierna:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=600&q=75",
  funcional:"https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=600&q=75",
  estiramiento:"https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=600&q=75",
  general:"https://images.unsplash.com/photo-1599058945522-28d584b6f0ff?w=600&q=75",
  femoral:"https://images.unsplash.com/photo-1530822847156-5df684ec5933?w=600&q=75"
};

const dias = [
{
  id:"lun", nombre:"Lunes", emoji:"🔙", foco:"Tracción: Espalda + Bíceps",
  tiempo:"90 min",
  moto:"La espalda es tu soporte estructural en horas de manejo. Bíceps y antebrazos fuertes = agarre firme del manubrio en saltos, baches y frenadas.",
  fases:[
    {label:"Calentamiento — 10 min", g:false, ej:[
      {id:"lun_cal", n:"Remo suave + rotaciones de hombro", s:"5 min remo ligero · 2×15 rotaciones", reps:0, series:0, m:"Activación espalda", log:false,
       d:"Remo en máquina con peso mínimo durante 5 minutos para activar la espalda. Después rotaciones de hombro: 15 hacia adelante, 15 hacia atrás, 2 veces.",
       t:"Siente cómo se activa el área entre los omóplatos: esos son los músculos protagonistas de hoy.",
       img:IMGS.maquina, yt:"calentamiento espalda antes de entrenar gym"}
    ]},
    {label:"Trabajo principal — 70 min", g:false, ej:[
      {id:"lun_1", n:"Jalón al pecho en polea (agarre ancho)", s:"4 series × 8-10 reps", reps:8, series:4, m:"Dorsal ancho", log:true, inc:2.5, repsMax:10,
       d:"Agarre más ancho que los hombros. Jala la barra hacia la parte alta del pecho sacando el pecho hacia adelante y llevando los codos hacia abajo y atrás. Sube en 3 segundos.",
       t:"Nunca detrás de la cabeza. Imagina que jalas con los codos, no con las manos: así trabaja la espalda y no el bíceps.",
       img:IMGS.maquina, yt:"jalon al pecho polea agarre ancho tecnica correcta"},
      {id:"lun_2", n:"Remo sentado con disco", s:"3 series × 8-10 reps", reps:8, series:3, m:"Espalda media + dorsales", log:true, inc:2, repsMax:10,
       d:"Siéntate en la máquina de remo tipo palanca (disc-loaded), pecho apoyado en el soporte. Toma los agarres, jala hacia atrás llevando los codos detrás del torso y juntando los omóplatos. Regresa controlado.",
       t:"El soporte de pecho fijo elimina compensación con la espalda baja: más seguro para acumular volumen pesado en espalda media.",
       img:IMGS.maquina, yt:"remo sentado maquina disco tecnica correcta"},
      {id:"lun_3", n:"Pullover en polea alta", s:"3 series × 10-12 reps", reps:10, series:3, m:"Dorsal ancho (estiramiento)", log:true, inc:1.25, repsMax:12,
       d:"De pie o con una rodilla en el suelo frente a la polea alta, agarre con ambas manos por encima de la cabeza. Con los codos casi extendidos y fijos, lleva el agarre hacia abajo y hacia los muslos en arco. Siente el estiramiento del dorsal arriba y la contracción abajo.",
       t:"Trabaja el dorsal en un ángulo distinto al remo, en una posición de longitud larga que los otros ejercicios del día no cubren.",
       img:IMGS.polea, yt:"pullover polea alta dorsal tecnica correcta"},
      {id:"lun_4", n:"Curl de bíceps con barra Z", s:"3 series × 10-12 reps", reps:10, series:3, m:"Bíceps", log:true, inc:1.25, repsMax:12,
       d:"De pie, agarre en los segmentos angulados de la barra Z. Codos fijos y pegados al torso. Sube contrayendo el bíceps, baja en 3 segundos controlados sin balancear el cuerpo.",
       t:"El ángulo de la barra Z reduce la tensión en la muñeca comparado con la barra recta, permitiéndote cargar más peso con menor molestia articular.",
       img:IMGS.mancuerna, yt:"curl biceps barra z tecnica correcta principiante"},
      {id:"lun_5", n:"Curl martillo (agarre neutro)", s:"3 series × 10-12 reps", reps:10, series:3, m:"Bíceps + antebrazo", log:true, inc:1, repsMax:12,
       d:"Igual que el curl normal pero con las palmas enfrentadas entre sí (como sostener un martillo). Sube y baja controlado.",
       t:"Este agarre fortalece el antebrazo y la muñeca: exactamente la musculatura que evita la fatiga de manos ('arm pump') en rutas largas de offroad.",
       img:IMGS.mancuerna, yt:"curl martillo mancuernas tecnica antebrazo"},
      {id:"lun_6", n:"Curl inverso (antebrazo)", s:"3 series × 12-15 reps", reps:12, series:3, m:"Antebrazo", log:true, inc:1, repsMax:15,
       d:"De pie, barra con agarre en pronación (palmas hacia abajo). Sube doblando los codos manteniéndolos fijos, baja controlado.",
       t:"Antebrazos fuertes son tu 'seguro de vida' contra la fatiga de manos en rutas largas de offroad.",
       img:IMGS.mancuerna, yt:"curl inverso antebrazo tecnica correcta"}
    ]},
    {label:"Cardio estratégico — 10 min", g:false, ej:[
      {id:"lun_car", n:"Elíptica — zona moderada", s:"10 min · ritmo conversacional", reps:0, series:0, m:"Cardio post-pesas", log:false,
       d:"10 minutos de elíptica a ritmo moderado. La elíptica involucra brazos y piernas sin impacto, ideal después de entrenar espalda.",
       t:"Mantén un ritmo donde puedas hablar. Más intensidad no es mejor cuando el objetivo es ganar músculo.",
       img:IMGS.cardio, yt:"eliptica ritmo moderado tecnica"}
    ]}
  ]
},
{
  id:"mar", nombre:"Martes", emoji:"💪", foco:"Empuje: Pecho + Hombro + Tríceps",
  tiempo:"90 min",
  moto:"Pecho, hombros y tríceps fuertes absorben las vibraciones del manubrio y te dan control en frenadas fuertes y terreno rugoso.",
  fases:[
    {label:"Calentamiento — 10 min", g:false, ej:[
      {id:"mar_cal", n:"Caminata en cinta + círculos de brazos", s:"5 min cinta · 2×15 círculos", reps:0, series:0, m:"Activación general", log:false,
       d:"Camina 5 minutos a paso moderado (5–6 km/h) con inclinación ligera. Después, de pie, haz círculos grandes de brazos hacia adelante y atrás, 15 en cada dirección, 2 veces.",
       t:"A los 42 años el calentamiento no es opcional: prepara articulaciones y tendones que tardan más en entrar en calor que a los 20.",
       img:IMGS.cardio, yt:"calentamiento hombros brazos antes de entrenar pecho"}
    ]},
    {label:"Trabajo principal — 70 min", g:false, ej:[
      {id:"mar_1", n:"Press de pecho en máquina", s:"4 series × 8-10 reps", reps:8, series:4, m:"Pecho", log:true, inc:2.5, repsMax:10,
       d:"Ajusta el asiento para que los agarres queden a la altura del pecho medio. Empuja hacia adelante en 2 segundos, regresa en 3 segundos. No bloquees los codos al final.",
       t:"Tu serie debe terminar sintiendo que podrías hacer solo 2 reps más (cerca del fallo, no al fallo). Si terminas fácil, sube peso la próxima sesión.",
       img:IMGS.maquina, yt:"press pecho maquina tecnica correcta principiante"},

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtShort(iso){
  const [y,m,d] = iso.split("-");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return d+" "+meses[parseInt(m)-1];
}

/* ============ SEMÁFORO DE PROGRESIÓN ============ */
const WEIGHT_STEP = 2.5;      // incremento por defecto en kg (si el ejercicio no define uno propio)
const SESIONES_CONFIRMACION = 2; // sesiones consecutivas exitosas requeridas antes de sugerir subir peso

function sessionHitsTarget(entry, targetReps){
  if(!entry || !entry.sets || !entry.sets.length) return false;
  return entry.sets.every(s => (s.r||0) >= targetReps && (s.w||0) > 0);
}

function progressionStatus(ex){
  // Solo aplica a ejercicios con registro de peso/reps
  if(!ex.log || !ex.reps) return {ready:false};
  const hist = logs[ex.id];
  if(!hist || !hist.length) return {ready:false};
  const last = hist[hist.length-1];
  if(!last.sets.length) return {ready:false};

  const lastHit = sessionHitsTarget(last, ex.reps);
  if(!lastHit) return {ready:false, last, confirmedCount:0};

  const lastMaxW = Math.max(...last.sets.map(s=>s.w||0));

  // Cuenta cuántas sesiones consecutivas más recientes (al mismo peso) cumplieron la meta
  let confirmedCount = 0;
  for(let i = hist.length - 1; i >= 0; i--){
    const entry = hist[i];
    const entryMaxW = Math.max(...entry.sets.map(s=>s.w||0));
    // Debe ser el mismo peso de trabajo para que cuente como confirmación del mismo nivel
    if(Math.abs(entryMaxW - lastMaxW) < 0.01 && sessionHitsTarget(entry, ex.reps)){
      confirmedCount++;
    } else {
      break;
    }
  }

  if(confirmedCount < SESIONES_CONFIRMACION){
    return {
      ready:false, last, confirmedCount,
      pending:true,
      pendingMsg:`Completaste la meta hoy (${confirmedCount}/${SESIONES_CONFIRMACION} sesiones seguidas con ${lastMaxW} kg). Repite este peso una vez más cumpliendo todas las series para confirmar el aumento.`
    };
  }

  const step = ex.inc || WEIGHT_STEP;
  const nextW = (lastMaxW + step);
  const nextWtxt = (nextW % 1 === 0) ? nextW.toFixed(0) : nextW.toFixed(1);
  const loR = Math.max(4, ex.reps-3), hiR = Math.max(loR+1, ex.reps-1);
  return {
    ready:true,
    last, confirmedCount,
    suggestion:`Confirmado en ${confirmedCount} sesiones seguidas con ${lastMaxW} kg. Sube a ${nextWtxt} kg (+${step} kg) y baja a ${loR}–${hiR} repeticiones por serie.`,
    short:`${nextWtxt} kg (+${step})`
  };
}

/* Señal temprana (complementaria) — "Regla del 2 por 2": la última serie supera
   el límite superior del rango por 2+ reps en las 2 sesiones más recientes al mismo peso.
   Es solo un aviso adicional: NO reemplaza ni acelera la regla oficial de arriba. */
function earlySignalStatus(ex){
  if(!ex.log || !ex.repsMax) return {signal:false};
  const hist = logs[ex.id];
  if(!hist || hist.length < 2) return {signal:false};
  const umbral = ex.repsMax + 2;
  const last = hist[hist.length-1];
  const lastSet = last.sets[last.sets.length-1];
  if(!lastSet || (lastSet.r||0) < umbral || (lastSet.w||0) <= 0) return {signal:false};
  const w = lastSet.w;
  const prev = hist[hist.length-2];
  const prevSet = prev.sets[prev.sets.length-1];
  const prevOk = prevSet && Math.abs((prevSet.w||0)-w) < 0.01 && (prevSet.r||0) >= umbral;
  return { signal:true, confirmed:prevOk, umbral, w };
}


function lastLogHtml(ex){
  const hist = logs[ex.id];
  if(!hist || !hist.length) return '<div class="last-session">Primera vez — registra tu peso inicial para empezar la carga progresiva.</div>';
  const last = hist[hist.length-1];
  const target = ex.reps||0;
  const sets = last.sets.map((s,i)=>{
    const hit = target>0 && (s.r||0)>=target;
    const mark = target>0 ? `<span class="set-check ${hit?'hit':'miss'}">${hit?'✓':'·'}</span>` : '';
    return `S${i+1}: <b>${s.w||0} kg × ${s.r||0}</b> ${mark}`;
  }).join(" &nbsp; ");
  let html = `<div class="last-session">📌 Última sesión (${fmtShort(last.date)}): ${sets}</div>`;
  const st = progressionStatus(ex);
  if(st.ready){
    html += `<div class="progress-alert">🔼 <b>¡Dominaste este peso!</b> ${st.suggestion}</div>`;
  } else if(st.pending){
    html += `<div class="progress-alert pending">⏳ <b>Casi listo.</b> ${st.pendingMsg}</div>`;
  }
  if(!st.ready){
    const es = earlySignalStatus(ex);
    if(es.signal){
      html += es.confirmed
        ? `<div class="progress-alert" style="background:rgba(121,192,255,.1);border-color:#79c0ff;color:#79c0ff">⚡ <b>Señal temprana confirmada.</b> Superaste ${es.umbral}+ reps en la última serie con ${es.w} kg en 2 sesiones seguidas (regla del documento). Aún falta que se cumpla tu regla oficial (todas las series) para que la app confirme el aumento.</div>`
        : `<div class="progress-alert" style="background:rgba(121,192,255,.08);border-color:#79c0ff66;color:#79c0ff">⚡ Superaste ${es.umbral}+ reps en la última serie con ${es.w} kg — señal temprana, no oficial todavía.</div>`;
    }
  }
  return html;
}

function logInputsHtml(ex){
  const hist = logs[ex.id];
  const last = hist && hist.length ? hist[hist.length-1] : null;
  let rows = "";
  for(let i=0;i<ex.series;i++){
    const lw = last && last.sets[i] ? last.sets[i].w : "";
    const lr = last && last.sets[i] ? last.sets[i].r : "";
    rows += `<div class="serie-row">
      <span class="serie-lbl">Serie ${i+1}</span>
      <input type="number" inputmode="decimal" placeholder="${lw!==""?lw:"peso"}" id="w_${ex.id}_${i}" onclick="event.stopPropagation()">
      <span class="unit-lbl">kg</span>
      <input type="number" inputmode="numeric" placeholder="${lr!==""?lr:ex.reps||"reps"}" id="r_${ex.id}_${i}" onclick="event.stopPropagation()">
      <span class="unit-lbl">rep</span>
    </div>`;
  }
  return rows;
}

function saveLog(ejId, nSeries){
  const sets=[];
  let any=false;
  for(let i=0;i<nSeries;i++){
    const w=document.getElementById(`w_${ejId}_${i}`);
    const r=document.getElementById(`r_${ejId}_${i}`);
    const wv=w&&w.value!==""?parseFloat(w.value):null;
    const rv=r&&r.value!==""?parseInt(r.value):null;
    // si está vacío, usa placeholder (última sesión) si existe
    const wFinal = wv!==null?wv:(w&&w.placeholder&&w.placeholder!=="peso"?parseFloat(w.placeholder):0);
    const rFinal = rv!==null?rv:(r&&r.placeholder&&r.placeholder!=="reps"?parseInt(r.placeholder):0);
    if(wFinal||rFinal) any=true;
    sets.push({w:wFinal,r:rFinal});
  }
  if(!any){ return; }
  if(!logs[ejId]) logs[ejId]=[];
  const t=todayStr();
  // si ya hay registro hoy, reemplázalo
  const idx=logs[ejId].findIndex(x=>x.date===t);
  if(idx>=0) logs[ejId][idx]={date:t,sets};
  else logs[ejId].push({date:t,sets});
  saveLogs();
  const btn=document.getElementById("save_"+ejId);
  if(btn){ btn.textContent="✓ Guardado"; btn.classList.add("saved"); setTimeout(()=>{btn.textContent="Guardar pesos de hoy";btn.classList.remove("saved");},1800); }
}

/* ============ VISTA ASISTENCIA ============ */
function renderAsistencia(){
  const y=calRef.getFullYear(), m=calRef.getMonth();
  const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7; // lunes=0
  const daysInMonth=new Date(y,m+1,0).getDate();
  const hoy=todayStr();
  const monthPrefix=y+"-"+String(m+1).padStart(2,"0")+"-";
  const gymThisMonth=att.filter(a=>a.startsWith(monthPrefix)).length;
  const totalGym=att.length;
  // racha semanal: días L-V de esta semana
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const monday=new Date(now); monday.setDate(now.getDate()-dow);
  let weekCount=0;
  for(let i=0;i<5;i++){
    const dd=new Date(monday); dd.setDate(monday.getDate()+i);
    const s=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    if(att.includes(s)) weekCount++;
  }

  let html=`
  <div class="section-intro">Marca cada día completado desde la pestaña Rutina. Tu constancia es el predictor #1 de resultados: la meta son 5 días por semana, y 4 también cuenta como una gran semana.</div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num gr">${weekCount}/5</div><div class="stat-lbl">Esta semana</div></div>
    <div class="stat-card"><div class="stat-num">${gymThisMonth}</div><div class="stat-lbl">Este mes</div></div>
    <div class="stat-card"><div class="stat-num">${totalGym}</div><div class="stat-lbl">Total histórico</div></div>
  </div>
  <div class="att-month">
    <button class="att-nav" onclick="calMove(-1)">‹</button>
    <div class="att-month-name">${meses[m]} ${y}</div>
    <button class="att-nav" onclick="calMove(1)">›</button>
  </div>
  <div class="cal-grid">`;
  ["L","M","X","J","V","S","D"].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html+=`<div class="cal-cell empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const ds=monthPrefix+String(day).padStart(2,"0");
    const isGym=att.includes(ds);
    const isToday=ds===hoy;
    html+=`<div class="cal-cell${isGym?' gym':''}${isToday?' today':''}">${day}</div>`;
  }
  html+=`</div>`;
  return html;
}
function calMove(d){ calRef=new Date(calRef.getFullYear(),calRef.getMonth()+d,1); render(); }

function muscleChips(exId){

      ? `<span style="background:${c}33;color:${c};border:1px solid ${c}66;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px">${MNAMES[id]}</span>`

  };

function sparklineSVG(hist, target){
  const pts = hist.slice(-10).map(h=>Math.max(...h.sets.map(s=>s.w||0)));
  if(pts.length<2) return `<div style="font-size:11px;color:var(--muted);text-align:center;padding:14px 0">Registra al menos 2 sesiones para ver tu tendencia</div>`;
  const W=280, H=56, PAD=6;
  const mn=Math.min(...pts), mx=Math.max(...pts);
  const rng=(mx-mn)||1;
  const px=i=>PAD+i*(W-2*PAD)/(pts.length-1);
  const py=v=>H-PAD-((v-mn)/rng)*(H-2*PAD);
  const poly=pts.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const area=`${PAD},${H-PAD} ${poly} ${px(pts.length-1).toFixed(1)},${H-PAD}`;
  const dots=pts.map((v,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3" fill="${i===pts.length-1?'#3fb950':'#79c0ff'}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <polygon points="${area}" fill="rgba(121,192,255,.12)"/>
    <polyline points="${poly}" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px"><span>${mn} kg</span><span>máx ${mx} kg</span></div>`;
}

function seriesBarsHTML(entry, target){
  if(!entry||!entry.sets.length) return "";
  return entry.sets.map((s,i)=>{
    const hit = target>0 && (s.r||0)>=target;
    const pct = target>0 ? Math.min(100, Math.round(((s.r||0)/target)*100)) : 100;
    const col = hit ? '#3fb950' : '#d29922';
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <span style="font-size:11px;color:var(--muted);width:44px;flex-shrink:0">Serie ${i+1}</span>
      <div style="flex:1;height:9px;background:var(--surface2);border-radius:5px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${col}"></div>
      </div>
      <span style="font-size:11px;font-weight:700;width:52px;text-align:right;color:${hit?'#3fb950':'#d29922'}">${s.w||0}kg×${s.r||0}</span>
    </div>`;
  }).join("");
}

/* ============ VISTA PROGRESO ============ */
function renderProgreso(){
  const allEx=[];
  dias.forEach(d=>d.fases.forEach(f=>f.ej.forEach(e=>{ if(e.log) allEx.push(e); })));
  const withLogs=allEx.filter(e=>logs[e.id]&&logs[e.id].length);
  if(!withLogs.length){
    return `<div class="empty-state"><i class="empty-ico">📈</i>Aún no hay registros.<br>Ve a la pestaña Rutina, abre un ejercicio y guarda tus pesos de hoy.<br><br><b style="color:var(--accent)">Sin registro no hay carga progresiva real.</b></div>`;
  }
  const readyList = withLogs.map(e=>({e, st:progressionStatus(e)})).filter(x=>x.st.ready);
  const pendingList = withLogs.map(e=>({e, st:progressionStatus(e)})).filter(x=>x.st.pending);
  let html=`<div class="section-intro">Cada tarjeta muestra tu peso actual, la tendencia de las últimas sesiones, el detalle de tu última sesión serie por serie, y el mapa muscular del ejercicio. Regla: <b style="color:var(--text)">${SESIONES_CONFIRMACION} sesiones seguidas</b> cumpliendo la meta con el mismo peso = subir peso y bajar a 8–10 reps.</div>`;
  if(readyList.length){
    html += `<div class="summary-ready">
      <div class="summary-ready-title">🔼 Confirmados — listos para subir peso (${readyList.length})</div>
      ${readyList.map(x=>`<div class="summary-ready-item"><b>${x.e.n}</b> — ${x.st.short}</div>`).join('')}
    </div>`;
  }
  if(pendingList.length){
    html += `<div class="summary-ready" style="background:rgba(240,136,62,.08);border-color:rgba(240,136,62,.3)">
      <div class="summary-ready-title" style="color:var(--accent)">⏳ Pendientes de confirmar (${pendingList.length})</div>
      ${pendingList.map(x=>`<div class="summary-ready-item"><b>${x.e.n}</b> — ${x.st.confirmedCount}/${SESIONES_CONFIRMACION} sesiones, repite el mismo peso una vez más</div>`).join('')}
    </div>`;
  }
  if(!readyList.length && !pendingList.length){
    html += `<div class="summary-none">Ningún ejercicio está cerca de subir peso todavía. Sigue registrando cada sesión.</div>`;
  }

  withLogs.forEach(e=>{
    const hist=logs[e.id];
    const last=hist[hist.length-1];
    const st=progressionStatus(e);
    const curW=Math.max(...last.sets.map(s=>s.w||0));
    const firstW=Math.max(...hist[0].sets.map(s=>s.w||0));
    const delta=curW-firstW;
    const deltaTxt = delta>0
      ? `<span style="font-size:11px;color:#3fb950;font-weight:700">▲ +${delta%1===0?delta.toFixed(0):delta.toFixed(1)} kg desde el inicio</span>`
      : `<span style="font-size:11px;color:var(--muted)">peso inicial</span>`;
    let badge='', badgeMsg='';
    if(st.ready){
      badge=`<span class="progress-badge">🔼 SUBE PESO</span>`;
      badgeMsg=`<div class="progress-alert" style="margin-top:10px;margin-bottom:0">🔼 ${st.suggestion}</div>`;
    } else if(st.pending){
      badge=`<span class="progress-badge pending">⏳ ${st.confirmedCount}/${SESIONES_CONFIRMACION}</span>`;
      badgeMsg=`<div class="progress-alert pending" style="margin-top:10px;margin-bottom:0">⏳ ${st.pendingMsg}</div>`;
    }
    if(!st.ready){
      const es = earlySignalStatus(e);
      if(es.signal){
        badgeMsg += es.confirmed
          ? `<div class="progress-alert" style="margin-top:8px;margin-bottom:0;background:rgba(121,192,255,.1);border-color:#79c0ff;color:#79c0ff">⚡ Señal temprana confirmada: ${es.umbral}+ reps en la última serie con ${es.w} kg en 2 sesiones seguidas.</div>`
          : `<div class="progress-alert" style="margin-top:8px;margin-bottom:0;background:rgba(121,192,255,.08);border-color:#79c0ff66;color:#79c0ff">⚡ Superaste ${es.umbral}+ reps en la última serie — señal temprana.</div>`;
      }
    }
    html+=`<div class="prog-ex-card" style="padding:14px 16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px">
        <div class="prog-ex-name" style="margin-bottom:0">${e.n}${badge}</div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Meta: ${e.s}</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
        <span style="font-size:26px;font-weight:800;color:var(--text)">${curW%1===0?curW.toFixed(0):curW.toFixed(1)} <span style="font-size:14px;font-weight:600;color:var(--muted)">kg</span></span>
        ${deltaTxt}
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          ${sparklineSVG(hist, e.reps)}
          <div style="font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:10px 0 6px">Última sesión (${fmtShort(last.date)})</div>
          ${seriesBarsHTML(last, e.reps)}
        </div>
        <div style="flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 4px 2px">
          ${bodySVG(e.id, 116)}
        </div>
      </div>
      <div style="margin-top:8px">${muscleChips(e.id)}</div>
      ${badgeMsg}
    </div>`;
  });
  html+=`<div class="section-intro" style="padding-top:8px">💾 Recuerda respaldar tus registros periódicamente desde la pestaña <b style="color:var(--accent2)">Guía → Respaldo en Google Drive</b>.</div>`;
  html+=`<div class="spacer"></div>`;
  return html;
}

/* ============ VISTA GUÍA ============ */
function renderGuia(){
  return `
  <div class="section-intro">Los principios detrás de tu programa. Léelos una vez por semana las primeras 4 semanas.</div>
  <div class="backup-card">
    <div class="backup-title">💾 Respaldo en Google Drive</div>
    <div class="backup-text">Tus registros viven en este teléfono. <b>Exporta</b> genera un archivo de respaldo que puedes guardar en Google Drive con un toque desde tus descargas (Compartir → Guardar en Drive). <b>Importar</b> restaura un respaldo y lo fusiona con tus datos actuales sin borrar nada.</div>
    <div class="backup-btns">
      <button class="bk-btn exp" onclick="exportBackup()">⬇ Exportar respaldo</button>
      <button class="bk-btn imp" onclick="document.getElementById('bk-file').click()">⬆ Importar</button>
    </div>
    <input type="file" id="bk-file" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
    <div class="backup-status" id="bk-status"></div>
    <div class="backup-meta" id="bk-meta">${lastBackupTxt()}</div>
  </div>
  <div class="guide-card"><div class="guide-title">🎯 Volumen semanal (el sweet spot)</div><div class="guide-text">Cada grupo muscular recibe entre 8 y 12 series semanales, el rango óptimo para ganar músculo como novato. Glúteos reciben ~12 series (énfasis solicitado) repartidas entre martes y jueves con 48 horas de descanso entre ambas.</div></div>
  <div class="guide-card"><div class="guide-title">🔁 Descanso entre grupos musculares</div><div class="guide-text">El split está diseñado para que ningún músculo se trabaje sin al menos 48 horas de recuperación: empuje (lunes) → pierna A (martes) → jale (miércoles) → pierna B (jueves) → core/funcional (viernes). El músculo crece durante el descanso, no durante el entrenamiento.</div></div>
  <div class="guide-card"><div class="guide-title">📝 Carga progresiva (la clave de todo)</div><div class="guide-text">Registra peso y repeticiones de CADA serie en la app. La regla: cuando completes todas las series con las reps objetivo en <b style="color:var(--accent2)">2 sesiones seguidas</b> con el mismo peso, sube el peso y baja repeticiones la siguiente sesión. El incremento ya no es fijo: es específico por ejercicio (por ejemplo +5 kg en sentadilla, +1 kg en elevaciones laterales) según el tamaño del grupo muscular y la estabilidad del movimiento. Exigir 2 sesiones confirma que dominaste el peso de verdad, no que tuviste un día excepcional. La app calcula esto automáticamente y te avisa con una etiqueta 🔼 cuando estés listo — y con un aviso ⚡ si superas el rango por 2+ reps en la última serie, como señal temprana antes de la confirmación oficial.</div></div>
  <div class="guide-card"><div class="guide-title">💪 Esfuerzo real (cerca del fallo)</div><div class="guide-text">Tus 12 repeticiones deben terminar sintiendo que solo podrías hacer 2 más con buena técnica (RIR 2). Si terminas fresco, el peso es poco. Si tu técnica se rompe antes de la rep 10, es demasiado. El rango útil de hipertrofia va de 6 a 20 reps.</div></div>
  <div class="guide-card"><div class="guide-title">🏃 Cardio estratégico</div><div class="guide-text">Siempre al final, 10 minutos, intensidad moderada (puedes mantener una conversación). Antes de pesas robaría energía al trabajo muscular, que es tu prioridad absoluta para ganar músculo.</div></div>
  <div class="guide-card"><div class="guide-title">🏍️ Conexión offroad</div><div class="guide-text">Cada día incluye trabajo directamente transferible a la moto: agarre (curl martillo, farmer's walk), core antirrotación (press Pallof), equilibrio unilateral (búlgaras, zancadas) y resistencia postural (hip thrust, lumbares). En 8-12 semanas notarás menos fatiga de brazos, mejor control de pie en los estribos y recuperación más rápida entre rutas.</div></div>
  <div class="guide-card"><div class="guide-title">🛌 Los otros 23 horas del día</div><div class="guide-text">Duerme 7-8 horas (el músculo crece dormido). Come ~1.6 g de proteína por kg de peso corporal al día (≈120-130 g para ti): pollo, huevo, atún, frijol, leche. A los 42 años la recuperación pide más atención que a los 25: si un día te sientes destruido, baja la intensidad ese día en lugar de faltar.</div></div>
  <div class="guide-card"><div class="guide-title">⚠️ Señales de alto</div><div class="guide-text">Dolor articular punzante (no confundir con ardor muscular), mareo o dolor en el pecho = detente ese día. Esta rutina sigue principios sólidos para principiantes, pero no sustituye la evaluación de un profesional. Cuando puedas, una sola sesión con un entrenador para validar tu técnica es la mejor inversión posible.</div></div>
  <div class="spacer"></div>`;
}

/* ============ RESPALDO / RESTAURACIÓN ============ */
const LS_LASTBK = "gym_lastbackup_v1";
function lastBackupTxt(){
  const v = localStorage.getItem(LS_LASTBK);
  return v ? "Último respaldo: "+fmtShort(v.slice(0,10))+" "+v.slice(11,16) : "Aún no has hecho ningún respaldo.";
}
function exportBackup(){
  try{
    const data = {
      app:"GymOffroad", version:1,
      exportado:new Date().toISOString(),
      registros:logs, asistencia:att
    };
    const totalLogs = Object.values(logs).reduce((a,h)=>a+h.length,0);
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const f = todayStr();
    a.href = url;
    a.download = `GymOffroad_respaldo_${f}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    const now=new Date().toISOString();
    try{ localStorage.setItem(LS_LASTBK, now); }catch(e){}
    const st=document.getElementById("bk-status");
    if(st){ st.className="backup-status ok"; st.textContent=`✓ Respaldo generado: ${totalLogs} registros de peso y ${att.length} días de asistencia. Ahora guárdalo en Google Drive desde tus descargas.`; }
    const meta=document.getElementById("bk-meta");
    if(meta) meta.textContent=lastBackupTxt();
  }catch(e){
    const st=document.getElementById("bk-status");
    if(st){ st.className="backup-status err"; st.textContent="✗ No se pudo generar el respaldo: "+e.message; }
  }
}
function importBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const st=document.getElementById("bk-status");
    try{
      const data = JSON.parse(ev.target.result);
      if(data.app!=="GymOffroad" || !data.registros || !data.asistencia){
        throw new Error("El archivo no es un respaldo válido de Gym Offroad.");
      }
      // fusiona: conserva lo más reciente por ejercicio/fecha
      Object.keys(data.registros).forEach(ejId=>{
        if(!logs[ejId]) logs[ejId]=[];
        data.registros[ejId].forEach(entry=>{
          const i=logs[ejId].findIndex(x=>x.date===entry.date);
          if(i>=0) logs[ejId][i]=entry; else logs[ejId].push(entry);
        });
        logs[ejId].sort((a,b)=>a.date<b.date?-1:1);
      });
      data.asistencia.forEach(d=>{ if(!att.includes(d)) att.push(d); });
      att.sort();
      saveLogs(); saveAtt();
      const totalLogs = Object.values(logs).reduce((a,h)=>a+h.length,0);
      if(st){ st.className="backup-status ok"; st.textContent=`✓ Respaldo restaurado y fusionado con tus datos actuales: ${totalLogs} registros de peso y ${att.length} días de asistencia en total.`; }
      updateStreak();
    }catch(e){
      if(st){ st.className="backup-status err"; st.textContent="✗ Error al importar: "+e.message; }
    }
    input.value="";
  };
  reader.readAsText(file);
}

/* ============ RENDER PRINCIPAL ============ */
function updateStreak(){
  const m=todayStr().slice(0,7);
  const c=att.filter(a=>a.startsWith(m)).length;
  const b=document.getElementById("streak-badge");
  if(b) b.textContent=`💪 ${c} día${c===1?'':'s'} este mes`;
}
function render(){
  const v=document.getElementById("view");
  if(tab==="rutina") v.innerHTML=renderRutina();
  else if(tab==="asistencia") v.innerHTML=renderAsistencia();
  else if(tab==="progreso") v.innerHTML=renderProgreso();
  else v.innerHTML=renderGuia();
  updateStreak();
}
render();
</script>
